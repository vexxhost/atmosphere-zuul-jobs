- name: Prepare the node for log collection
  hosts: all
  become: true
  tasks:
    - name: Install "jq" for log collection
      ansible.builtin.apt:
        name: jq
        update_cache: true
      when:
        - ansible_facts['os_family'] | lower == 'debian'

- name: Deploy from the release manifest built for this buildset
  hosts: all
  roles:
    - atmosphere-use-manifest
